
site_name: PCAP Documentation
site_description: Patch-clamp electrophysiology analysis
repo_url: https://github.com/theafairfax/pcap

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Kinetics Visualizer: kinetics-visualizer.md
  - Bulk Kinetics: bulk-kinetics.md
  - Compare Groups: compare-groups.md
  - Mathematical Methods: mathematical-methods.md
  - Limitations: limitations.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
